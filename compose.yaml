services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: tara
    volumes:
      - tara_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tara"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build:
      context: .
      dockerfile: Code/Dockerfile
    environment:
      DATABASE_URL: postgresql://tara:${POSTGRES_PASSWORD}@db:5432/tara
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  tara_postgres:
