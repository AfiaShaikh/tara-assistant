name: tara-ai
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_DB: tara
    volumes:
      - tara_ai_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tara -d tara"]
      interval: 5s
      timeout: 3s
      retries: 20
  ollama:
    image: ollama/ollama:latest
    volumes:
      - tara_ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
  app:
    build:
      context: .
      dockerfile: Code/Dockerfile
    environment:
      DATABASE_URL: postgresql://tara:${POSTGRES_PASSWORD}@db:5432/tara
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b-instruct
      OLLAMA_TIMEOUT: "600"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
volumes:
  tara_ai_postgres:
  tara_ollama:
